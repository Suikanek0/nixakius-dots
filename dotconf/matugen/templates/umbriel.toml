# ~/.config/matugen/templates/umbriel.toml

[colors]
background = "#{{colors.surface.default.hex_stripped}}FF"
text_primary = "#{{colors.on_surface.default.hex_stripped}}FF"
text_muted = "#{{colors.on_surface_variant.default.hex_stripped}}FF"
accent_primary = "#{{colors.primary.default.hex_stripped}}FF"
accent_secondary = "#{{colors.secondary.default.hex_stripped}}FF"
warning = "#{{colors.tertiary.default.hex_stripped}}FF"
error = "#{{colors.error.default.hex_stripped}}FF"
insert_hint = "#{{colors.primary.default.hex_stripped}}80"
backdrop = "#000000FF"
shadow = "#0000007F"

[colors.border]
focused = "#{{colors.primary.default.hex_stripped}}"
unfocused = "#{{colors.surface_container_high.default.hex_stripped}}"
outer = "#{{colors.surface_container_lowest.default.hex_stripped}}"

[colors.tab_bar]
background = "#{{colors.surface_container.default.hex_stripped}}"
text = "#{{colors.on_surface.default.hex_stripped}}"
active = "#{{colors.primary.default.hex_stripped}}"
active_text = "#{{colors.on_primary.default.hex_stripped}}"
