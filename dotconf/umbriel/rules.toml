# Workspaces
[[workspace]]
name = "main"
output = "DP-1"

[[workspace]]
name = "term"
layout.mode = "dwindle"
output = "DP-1"

[[workspace]]
name = "steam"
output = "DP-1"

[[workspace]]
name = "chat"
output = "DP-2"

[[workspace]]
name = "music"
output = "HDMI-A-1"

[[workspace]]
name = "tools"
layout.mode = "master" 
output = "HDMI-A-1"

[[workspace]]
name = "obs"
output = "HDMI-A-1"

[[window_rule]]
blur = true

[[window_rule]]
match.app_id = '^org\.nicotine_plus\.Nicotine$'
default_workspace = "tools"

[[window_rule]]
match.app_id = '^com\.github\.wwmm\.easyeffects$'
default_workspace = "tools"

[[window_rule]]
match.app_id = '^org\.pulseaudio\.pavucontrol$' 
default_scratchpad = "default"

[[window_rule]]
match.app_id = "^kitty$"
default_workspace = "term"
opacity = 0.9

# Cava
[[window_rule]]
match.app_id = "^eyecandy$"
match.title = "^cava$"
default_output = "HDMI-A-1"
default_workspace = "music"
default_floating = true
default_floating_size_px = { width = 1171, height = 106 }
default_position = { x = 25, y = 726, anchor = "top_left" }

# RMPC
[[window_rule]]
match.app_id = "^rmpc$"
default_output = "HDMI-A-1"
default_workspace = "music"
default_floating = true
default_floating_size_px = { width = 1026, height = 659 }
default_position = { x = 24, y = 25, anchor = "top_left" }

# Pipes.sh
[[window_rule]]
match.app_id = "^eyecandy$"
match.title = "^pipes\\.sh$"
default_output = "HDMI-A-1"
default_workspace = "music"
default_floating = true
default_floating_size_px = { width = 136, height = 451 }
default_position = { x = 1103, y = 241, anchor = "top_left" }

# Lavat
[[window_rule]]
match.app_id = "^lavat$"
default_output = "HDMI-A-1"
default_workspace = "music"
default_floating = true
default_floating_size_px = { width = 168, height = 567 }
default_position = { x = 1308, y = 243, anchor = "top_left" }

# Peaclock
[[window_rule]]
match.app_id = "^eyecandy$"
match.title = "^peaclock$"
default_output = "HDMI-A-1"
default_workspace = "music"
default_floating = true
default_floating_size_px = { width = 413, height = 196 }
default_position = { x = 1082, y = 15, anchor = "top_left" }

[[window_rule]]
match.app_id = "^zen-beta$"
default_workspace = "main"
opacity = 1.0

[[window_rule]]
match.app_id = "^vesktop$"
default_workspace = "chat"
opacity = 1.0

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

# Keep game menus inside their window; a focus or workspace keybind releases the pointer.
[[window_rule]]
match.app_id = "^steam_app_.*$"
confine_pointer = true

[[window_rule]]
match.app_id = "^steam$"
default_workspace = "steam"

# Keep an application drawing while it is hidden on another workspace, for programs whose other work stalls without it.
[[window_rule]]
match.app_id = "^obs$"
background_render = true

