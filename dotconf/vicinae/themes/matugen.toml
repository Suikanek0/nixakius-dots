# Vicinae Matugen Theme Template
# Used LLM for initial generation, then modified to a satisfactory level

[meta]
name = "Matugen"
description = "Material You theme generated by Matugen - dark variant"
variant = "dark"

# ============================================================================
# Core Colors
# ============================================================================

[colors.core]
accent = "#adc6ff"
accent_foreground = "#102f60"
background = "#111318"
foreground = "#e2e2e9"
secondary_background = "#1e1f25"
border = "#44474f"

# ============================================================================
# Window Borders
# ============================================================================

[colors.main_window]
border = "#44474f"

[colors.settings_window]
border = "#8e9099"

# ============================================================================
# Accent Palette
# ============================================================================

[colors.accents]
blue = "#adc6ff"
green = "#debcdf"
magenta = "#bfc6dc"
orange = { name = "#ffb4ab", lighter = 40 }
red = "#ffb4ab"
yellow = { name = "#debcdf", lighter = 80 }
cyan = { name = "#adc6ff", lighter = 50 }
purple = "#bfc6dc"

# ============================================================================
# Text System
# ============================================================================

[colors.text]
default = "#e2e2e9"
muted = "#c4c6d0"
danger = "#ffb4ab"
success = "#debcdf"
placeholder = { name = "#c4c6d0", opacity = 0.6 }

[colors.text.selection]
background = "#adc6ff"
foreground = "#102f60"

[colors.text.links]
default = "#adc6ff"
visited = { name = "#debcdf", darker = 20 }

# ============================================================================
# Input Fields
# ============================================================================

[colors.input]
border = "#8e9099"
border_focus = "#adc6ff"
border_error = "#ffb4ab"

# ============================================================================
# Buttons
# ============================================================================

[colors.button.primary]
background = "#282a2f"
foreground = "#e2e2e9"

[colors.button.primary.hover]
background = "#33353a"  

[colors.button.primary.focus]
outline = "#adc6ff"

# ============================================================================
# Lists
# ============================================================================

[colors.list.item.hover]
background = { name = "#2b4678", opacity = 0.25 }  
foreground = "#e2e2e9"

[colors.list.item.selection]
background = { name = "#2b4678", opacity = 0.50 }
foreground = "#d8e2ff"
secondary_background = "#2b4678"
secondary_foreground = "#d8e2ff"

# ============================================================================
# Grid Items
# ============================================================================

[colors.grid.item]
background = "#1e1f25"

[colors.grid.item.hover]
outline = { name = "#bfc6dc", opacity = 0.8 }

[colors.grid.item.selection]
outline = { name = "#adc6ff" }

# ============================================================================
# Scrollbars
# ============================================================================

[colors.scrollbars]
background = { name = "#adc6ff", opacity = 0.2 }

# ============================================================================
# Loading States
# ============================================================================

[colors.loading]
bar = "#adc6ff"
spinner = "#adc6ff"
