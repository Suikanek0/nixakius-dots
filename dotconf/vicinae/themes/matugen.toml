# Vicinae Matugen Theme Template
# Used LLM for initial generation, then modified to a satisfactory level

[meta]
name = "Matugen"
description = "Material You theme generated by Matugen - dark variant"
variant = "dark"

# ============================================================================
# Core Colors
# ============================================================================

[colors.core]
accent = "#dec56e"
accent_foreground = "#3b2f00"
background = "#16130b"
foreground = "#e9e2d4"
secondary_background = "#221f17"
border = "#4b4639"

# ============================================================================
# Window Borders
# ============================================================================

[colors.main_window]
border = "#4b4639"

[colors.settings_window]
border = "#979080"

# ============================================================================
# Accent Palette
# ============================================================================

[colors.accents]
blue = "#dec56e"
green = "#aad0b1"
magenta = "#d2c6a1"
orange = { name = "#ffb4ab", lighter = 40 }
red = "#ffb4ab"
yellow = { name = "#aad0b1", lighter = 80 }
cyan = { name = "#dec56e", lighter = 50 }
purple = "#d2c6a1"

# ============================================================================
# Text System
# ============================================================================

[colors.text]
default = "#e9e2d4"
muted = "#cec6b4"
danger = "#ffb4ab"
success = "#aad0b1"
placeholder = { name = "#cec6b4", opacity = 0.6 }

[colors.text.selection]
background = "#dec56e"
foreground = "#3b2f00"

[colors.text.links]
default = "#dec56e"
visited = { name = "#aad0b1", darker = 20 }

# ============================================================================
# Input Fields
# ============================================================================

[colors.input]
border = "#979080"
border_focus = "#dec56e"
border_error = "#ffb4ab"

# ============================================================================
# Buttons
# ============================================================================

[colors.button.primary]
background = "#2d2a21"
foreground = "#e9e2d4"

[colors.button.primary.hover]
background = "#38352b"  

[colors.button.primary.focus]
outline = "#dec56e"

# ============================================================================
# Lists
# ============================================================================

[colors.list.item.hover]
background = { name = "#554500", opacity = 0.25 }  
foreground = "#e9e2d4"

[colors.list.item.selection]
background = { name = "#554500", opacity = 0.50 }
foreground = "#fbe186"
secondary_background = "#554500"
secondary_foreground = "#fbe186"

# ============================================================================
# Grid Items
# ============================================================================

[colors.grid.item]
background = "#221f17"

[colors.grid.item.hover]
outline = { name = "#d2c6a1", opacity = 0.8 }

[colors.grid.item.selection]
outline = { name = "#dec56e" }

# ============================================================================
# Scrollbars
# ============================================================================

[colors.scrollbars]
background = { name = "#dec56e", opacity = 0.2 }

# ============================================================================
# Loading States
# ============================================================================

[colors.loading]
bar = "#dec56e"
spinner = "#dec56e"
